# Xcode project for the iOS companion. Regenerate after adding files: `xcodegen` (brew install xcodegen).
name: PortalCompanion
options:
  bundleIdPrefix: local.notchisland
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Free Apple ID: put your Personal Team here or pick it in Xcode → Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PortalCompanion:
    type: application
    platform: iOS
    # PortalPairing.swift is shared with the Mac app (handshake messages, crypto, Keychain).
    sources: [PortalCompanion, ../Sources/NotchIslandCore/PortalPairing.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.notchisland.portalcompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: PortalCompanion/Info.plist
      properties:
        CFBundleDisplayName: Portal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Portal ищет твой Mac с NotchIsland в локальной сети, чтобы отправлять на него фото и файлы.
        NSBonjourServices: [_notch-portal._tcp, _notch-portal._udp]
