# Builds NotchIsland and runs the unit tests on every pull request and every push to main.
# A red check means: don't merge, don't release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick look at what changed (Linux, ~10 s, no wait for a macOS runner). Only docs → the build is
  # skipped, and a skipped job counts as passed for the required check, so the PR can be merged.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Manual runs, new branches and anything unexpected: build to be safe.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # Docs only: Markdown anywhere, docs/ and promo/.
          if echo "$files" | grep -qvE '(\.md$|^docs/|^promo/)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      # SwiftPM checkouts and build products; keyed by the pinned dependencies (Sparkle).
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Compiled by build.sh into the app bundle; checked here so a broken bridge shows up before a release.
      - name: Now Playing bridge
        run: clang -dynamiclib -fobjc-arc -O2 -framework Foundation -o "$RUNNER_TEMP/NowPlayingBridge.dylib" Helper/NowPlayingBridge.m
